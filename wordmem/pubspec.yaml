name: wordmem
description: "词记 - 可离线运行的英语记单词 App（FSRS 间隔复习）"
publish_to: 'none'
version: 2.1.3+21

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Database (raw sqlite3, no code generation needed)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28

  # State & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utils
  file_picker: ^8.3.1
  path: ^1.9.0
  path_provider: ^2.1.5
  archive: ^3.6.1
  crypto: ^3.0.6
  xml: ^7.0.1 # sync: PROPFIND 响应自解析（webdav_client_plus readDir 有双重 decode bug，见 Task 0 实测记录）
  webdav_client_plus: ^2.0.0 # sync: WebDAV 客户端（只允许在 lib/infra/sync/ 内引用）
  shared_preferences: ^2.3.5
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2

  # Audio (word pronunciation: local mp3 cache playback + system TTS fallback)
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
    - assets/data/
