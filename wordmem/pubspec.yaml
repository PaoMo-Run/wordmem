name: wordmem
description: "词记 - 离线英语词库与间隔复习 App"
publish_to: 'none'
version: 1.2.0+12

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Database (raw sqlite3, no code generation needed)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28

  # State & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utils
  file_picker: ^8.3.1
  path: ^1.9.0
  path_provider: ^2.1.5
  archive: ^3.6.1
  crypto: ^3.0.6
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
